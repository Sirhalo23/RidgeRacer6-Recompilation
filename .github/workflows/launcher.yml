# Builds "RR6 Launcher.exe" (the launcher only: the game cannot be built here,
# because that needs the game itself).
name: Launcher

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Build
        run: sh launcher/build.sh
      - name: SHA-256
        run: sha256sum "launcher/RR6 Launcher.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: RR6-Launcher
          path: launcher/RR6 Launcher.exe
          if-no-files-found: error
