# Builds "RR6 Launcher.exe" and the Linux disc-image tool, and checks the Linux
# scripts. The game itself cannot be built here, because that needs the game.
name: Launcher

# src/** and the checker are included for the check of the game sources below,
# which is quick and needs no game files.
on:
  push:
    paths:
      - 'launcher/**'
      - 'linux/**'
      - 'src/**'
      - 'tools/check_windows_names.py'
      - 'build-linux.sh'
      - '.github/workflows/launcher.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'linux/**'
      - 'src/**'
      - 'tools/check_windows_names.py'
      - 'build-linux.sh'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Check the game sources for names the Windows headers define
        run: python3 tools/check_windows_names.py src/*.cpp src/*.h
      - name: Build
        run: sh launcher/build.sh
      - name: SHA-256
        run: sha256sum "launcher/RR6 Launcher.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: RR6-Launcher
          path: launcher/RR6 Launcher.exe
          if-no-files-found: error

  linux-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the disc-image tool
        run: g++ -std=c++17 -O2 -Wall -Wextra -static -pthread launcher/rr6_extract.cpp launcher/disc_image.cpp -o rr6-extract
      - name: Check the shell scripts
        run: shellcheck -S style linux/*.sh build-linux.sh
